repos:
  - repo: https://github.com/psf/black
    rev: 23.1.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.11.5
    hooks:
      - id: isort
        files: \.py$
        args: [--profile=black]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.0.267"
    hooks:
      - id: ruff

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: authoring-ui/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^authoring-ui/
        types_or: [json, ts, tsx, javascript, css]